name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release --no-restore
      - run: dotnet pack src/Supporter.Core -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Supporter.Infrastructure -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Supporter.Client -c Release --no-build -o artifacts/packages
